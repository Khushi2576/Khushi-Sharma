<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-indigo-100 to-purple-200 min-h-screen">

    <div class="max-w-xl mx-auto px-4 py-10">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-700">
                My To-Do List
            </h1>

            <p class="text-gray-600 mt-2">
                Organize your academic and personal tasks
            </p>
        </div>

        <!-- Input Section -->
        <div class="bg-white p-5 rounded-xl shadow-lg">

            <div class="flex gap-2">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-3
                           focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >

                <button
                    id="addTaskBtn"
                    class="bg-indigo-600 text-white px-5 py-3 rounded-lg
                           hover:bg-indigo-700 transition font-semibold">
                    Add
                </button>

            </div>

            <!-- Task List -->
            <ul id="taskList" class="mt-6 space-y-3"></ul>

            <!-- Empty Message -->
            <p id="emptyMessage" class="text-center text-gray-500 mt-6">
                No tasks added yet.
            </p>

        </div>

        <!-- Footer -->
        <p class="text-center text-gray-500 mt-6 text-sm">
            Stay organized • Stay productive
        </p>

    </div>


    <script>

        // Get HTML elements
        const taskInput = document.getElementById("taskInput");
        const addTaskBtn = document.getElementById("addTaskBtn");
        const taskList = document.getElementById("taskList");
        const emptyMessage = document.getElementById("emptyMessage");


        // Add task function
        function addTask() {

            // Get input value
            const taskText = taskInput.value.trim();

            // Check empty task
            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            // Create list item
            const li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-gray-50 " +
                "border border-gray-200 rounded-lg p-3";


            // Create task text
            const span = document.createElement("span");

            span.textContent = taskText;

            span.className =
                "text-gray-700 flex-1 cursor-pointer";


            // Mark task as completed
            span.addEventListener("click", function () {

                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-400");

            });


            // Create delete button
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.className =
                "bg-red-500 text-white px-3 py-2 rounded-lg " +
                "hover:bg-red-600 transition ml-3";


            // Delete task
            deleteButton.addEventListener("click", function () {

                li.remove();

                updateEmptyMessage();

            });


            // Add elements to list item
            li.appendChild(span);
            li.appendChild(deleteButton);

            // Add task to task list
            taskList.appendChild(li);

            // Clear input
            taskInput.value = "";

            // Hide empty message
            updateEmptyMessage();
        }


        // Check whether task list is empty
        function updateEmptyMessage() {

            if (taskList.children.length === 0) {
                emptyMessage.style.display = "block";
            } else {
                emptyMessage.style.display = "none";
            }

        }


        // Add button click event
        addTaskBtn.addEventListener("click", addTask);


        // Press Enter to add task
        taskInput.addEventListener("keypress", function (event) {

            if (event.key === "Enter") {
                addTask();
            }

        });

    </script>

</body>
</html>
